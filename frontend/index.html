<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA & Mobile Installability Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Krishi Vaani">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <title>KRISHI VAANI | Smart Weather Alerts</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="glass">
        <a href="index.html" class="logo"><img src="/assets/icons/leaf.png" alt="Krishi Vaani" class="kv-icon kv-icon-sm"> KRISHI VAANI</a>
        <div class="nav-links">
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            <a href="login.html" class="btn btn-glass">Login</a>
            <a href="register.html" class="btn btn-primary">Sign Up</a>
        </div>
        <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- Mobile Navigation Backdrop -->
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop" onclick="if(typeof closeMobileDrawer==='function')closeMobileDrawer()"></div>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-nav-drawer" id="mobileNavDrawer" role="dialog" aria-label="Mobile Navigation Menu">
        <div class="mobile-drawer-header">
            <div class="mobile-drawer-brand">
                <div class="brand-icon-wrap" style="width: 28px; height: 28px;"><img src="/assets/icons/leaf.png" alt="Krishi Vaani" class="kv-icon kv-icon-sm"></div>
                <span style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);">KRISHI VAANI</span>
            </div>
            <button type="button" class="mobile-drawer-close" id="mobileNavClose" onclick="if(typeof closeMobileDrawer==='function')closeMobileDrawer()" aria-label="Close menu">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="mobile-drawer-actions" style="display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem 0;">
            <div class="mobile-drawer-theme-box">
                <div class="mobile-drawer-theme-label">
                    <i class="fas fa-moon"></i>
                    <span>Theme</span>
                </div>
                <button type="button" class="theme-toggle" onclick="document.getElementById('themeToggle')?.click()" aria-label="Toggle Theme">
                    <i class="fas fa-circle-half-stroke"></i>
                </button>
            </div>
        </div>

        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="login.html" class="btn btn-glass" style="text-align: center; justify-content: center; padding: 0.75rem; font-weight: 600;">Login</a>
            <a href="register.html" class="btn btn-primary" style="text-align: center; justify-content: center; padding: 0.75rem; font-weight: 600;">Sign Up</a>
        </div>
    </div>

    <div class="container flex-center">
        <div class="glass glass-card" style="text-align: center; max-width: 800px; padding: 4rem 2rem;">
            <h1 style="font-size: 3rem; margin-bottom: 1.5rem;">Smart Weather Alert System for Farmers</h1>
            <p style="font-size: 1.2rem; margin-bottom: 2.5rem; color: var(--text-secondary); line-height: 1.6;">
                Get real-time weather forecasts, customized SMS & Voice call alerts for extreme conditions, and AI-powered agricultural advice tailored to your needs.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="register.html" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 2rem;">Get Started Now</a>
                <a href="login.html" class="btn btn-glass" style="font-size: 1.1rem; padding: 1rem 2rem;">Farmer Login</a>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
