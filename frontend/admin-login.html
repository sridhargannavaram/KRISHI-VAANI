<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishi Vaani | Admin Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #16a34a;
            --primary-hover: #15803d;
            --primary-dark: #0f172a;
            --bg-body: #0b1329;
            --bg-card: #111e38;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(22, 163, 74, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.3) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-main);
        }

        .login-card {
            background: rgba(17, 30, 56, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo-badge {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.7rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 16px rgba(22, 163, 74, 0.3);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge-admin {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: rgba(22, 163, 74, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 0.2rem 0.65rem;
            border-radius: 9999px;
            margin-top: 0.4rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.84rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: #64748b;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            height: 48px;
            padding: 0 2.8rem 0 2.8rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            color: #ffffff;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.25);
        }

        .toggle-password-btn {
            position: absolute;
            right: 0.85rem;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.4rem;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .toggle-password-btn:hover {
            color: #cbd5e1;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
            margin-top: 1.5rem;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error-box {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            align-items: center;
            gap: 0.6rem;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.8rem;
            color: #64748b;
        }

        .footer-note a {
            color: #4ade80;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo-badge">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1 class="brand-title">Krishi Vaani</h1>
            <div class="brand-subtitle">Administrator Portal</div>
            <div class="badge-admin"><i class="fas fa-lock"></i> Protected Interface</div>
        </div>

        <div class="alert-error-box" id="errorBox">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorMessage">Invalid email/mobile number or password.</span>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label class="form-label" for="identifier">Admin Email or Mobile</label>
                <div class="input-wrap">
                    <i class="fas fa-user-shield input-icon"></i>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="identifier" 
                        placeholder="Email (e.g. admin@...) or 10-digit mobile" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-key input-icon"></i>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        placeholder="••••••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                        <i class="fas fa-eye" id="pwdToggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <i class="fas fa-right-to-bracket"></i> Sign In to Admin Portal
            </button>
        </form>

        <div class="footer-note">
            Farmer login? <a href="index.html">Farmer Portal</a>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        // Check if admin is already signed in
        document.addEventListener('DOMContentLoaded', () => {
            const adminToken = localStorage.getItem('admin_token');
            if (adminToken) {
                // Verify if token is still valid
                fetch(`${API_BASE_URL}/auth/admin/me`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                }).then(res => {
                    if (res.ok) {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        localStorage.removeItem('admin_token');
                        localStorage.removeItem('admin_user');
                    }
                }).catch(() => {});
            }
        });

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('pwdToggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const btnSubmit = document.getElementById('btnSubmit');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMessage');

            errorBox.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            try {
                const res = await fetch(`${API_BASE_URL}/auth/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await res.json();

                if (res.ok && data.success && data.token) {
                    // Store admin credentials securely in localStorage
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_user', JSON.stringify(data.admin));

                    btnSubmit.innerHTML = '<i class="fas fa-check"></i> Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 400);
                } else {
                    errorMsg.innerText = data.error || 'Invalid email/mobile number or password.';
                    errorBox.style.display = 'flex';
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In to Admin Portal';
                }
            } catch (err) {
                errorMsg.innerText = 'Unable to connect to server. Please try again.';
                errorBox.style.display = 'flex';
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In to Admin Portal';
            }
        }
    </script>
</body>
</html>
